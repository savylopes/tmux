bind-key g new-window "lazygit"
# unbind C-b
# set -g prefix C-Space

# Very subtle cue: inactive panes barely dimmed
set -g window-style 'fg=colour252,bg=colour234'
set -g window-active-style 'fg=default,bg=colour233'

# Quiet border on the selected pane
set -g pane-border-style 'fg=colour236'
set -g pane-active-border-style 'fg=colour242'
